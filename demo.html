<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut" />
  <title>Province Forge — cliente de demonstração</title>
  <style>
    :root { color-scheme: dark; --bg: #11161c; --panel: #1a2129; --line: #2c3742; --fg: #e6e1d6; --dim: #9aa4ad; --acc: #d9b45b; }
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
    header h1 small { color: var(--dim); font-weight: 400; }
    label { display: flex; gap: 6px; align-items: center; color: var(--dim); }
    select, button { font: inherit; color: var(--fg); background: #232c36; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 36px; }
    .stage { position: relative; overflow: hidden; }
    .info { position: absolute; left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); max-width: min(340px, calc(100% - 24px)); background: rgba(26,33,41,.94); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; pointer-events: none; }
    .info b { color: var(--acc); }
    .zoom { position: absolute; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; }
    .zoom button { width: 44px; height: 44px; font-size: 20px; }
    .note { position: absolute; right: 12px; top: 10px; color: var(--dim); font-size: 12px; background: rgba(17,22,28,.8); padding: 4px 8px; border-radius: 6px; }
    .err { padding: 24px; color: #f08a7a; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/demo/main.tsx"></script>
</body>
</html>
