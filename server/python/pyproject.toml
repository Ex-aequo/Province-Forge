[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exaequo-map"
version = "0.1.0"
description = "Server-side helpers for Province Forge maps: fog-of-war filtering, reserved starts, map bundles, FastAPI example."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "pydantic>=2"]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]

[tool.setuptools.packages.find]
include = ["exaequo_map*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
