# Province Forge — static map files. Include inside your `server { … }` block.
#
# Bundles live in /srv/province-forge/maps/<mapId>/. Only the client map and the tiles
# are public; static-map.json (resources, start positions, values) and manifest.json
# must NEVER be served — the API reads them from disk.
#
# Map ids and client-map file names are content hashes, so everything here is immutable
# and can be cached forever.

location ~ "^/maps/[0-9a-f]{16}/(client-map\.[0-9a-f]{12}\.json|tiles/[0-9]+/[0-9]+/[0-9]+\.webp)$" {
    root /srv/province-forge;      # URL /maps/<id>/… → /srv/province-forge/maps/<id>/…
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    gzip on;                       # the client map compresses ~4x; webp is left as is
    gzip_types application/json;
    try_files $uri =404;
}

# anything else under /maps/ (static-map.json, manifest.json, .job-* work dirs) -> 404
location ^~ /maps/ { return 404; }
