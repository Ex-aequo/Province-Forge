# Province Forge — static map files. Include inside your `server { … }` block.
#
# Bundles live in /srv/province-forge/maps/<mapId>/. Only the terrain TILES are public
# (relief, coasts, water — no borders, no names). Never serve:
#   static-map.json    resources, start positions, values
#   client-map.*.json  the whole world's provinces — each player gets a copy cut to what
#                      they can see from GET /games/{id}/turns/{n}/map (the API)
#   manifest.json
#
# Map ids are content hashes, so tiles are immutable and can be cached forever.

location ~ "^/maps/[0-9a-f]{16}/tiles/[0-9]+/[0-9]+/[0-9]+\.webp$" {
    root /srv/province-forge;      # URL /maps/<id>/… → /srv/province-forge/maps/<id>/…
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
}

# anything else under /maps/ (client map, static map, manifest, .job-* dirs) -> 404
# (plain prefix, NOT ^~ — with ^~ nginx would skip the tiles regex above)
location /maps/ { return 404; }
